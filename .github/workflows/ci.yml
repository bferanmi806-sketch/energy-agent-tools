name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run python scripts/check_release_versions.py
      - run: uv run pytest -q
      - run: uv build
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen --no-dev
      - run: docker build --tag energy-agent-tools:ci .
      - run: docker run --rm --entrypoint python energy-agent-tools:ci scripts/deployment_smoke.py
      - run: uv run --no-dev python scripts/container_host_smoke.py --image energy-agent-tools:ci
  home-assistant:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen --no-dev
      - run: uv run --no-dev python scripts/qualify_home_assistant.py > ha-qualification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-assistant-protocol-qualification
          path: ha-qualification.json
          if-no-files-found: error
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen --no-dev
      - name: Install published baseline
        run: |
          mkdir -p work/upgrade-baseline
          curl --fail --location --retry 3 https://github.com/bferanmi806-sketch/energy-agent-tools/releases/download/v0.2.0/energy_agent_tools-0.2.0-py3-none-any.whl --output work/upgrade-baseline/energy_agent_tools-0.2.0-py3-none-any.whl
          echo '9da16b10b7f6a51db8c3c7b8d4e82f47f91a471ed1965d0e260589cd06bd31e1  work/upgrade-baseline/energy_agent_tools-0.2.0-py3-none-any.whl' | sha256sum --check
          uv venv work/upgrade-baseline/venv --python 3.12
          uv pip install --python work/upgrade-baseline/venv/bin/python work/upgrade-baseline/energy_agent_tools-0.2.0-py3-none-any.whl
      - run: uv run --no-dev python scripts/upgrade_smoke.py --baseline-python work/upgrade-baseline/venv/bin/python --baseline-wheel work/upgrade-baseline/energy_agent_tools-0.2.0-py3-none-any.whl > upgrade-qualification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-state-upgrade-qualification
          path: upgrade-qualification.json
          if-no-files-found: error
